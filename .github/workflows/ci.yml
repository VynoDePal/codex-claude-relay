name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Pas de Codex Desktop sur le runner : version de client fixe pour le routeur.
env:
  CODEX_CLIENT_VERSION: 0.167.0

jobs:
  tests:
    name: Tests et controle des secrets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Controle des secrets
        run: bash scripts/check-secrets.sh

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Dependances
        run: python -m pip install --upgrade pip aiohttp cryptography Pillow

      # -v nomme chaque test ; un test bloque plus de 5 minutes est interrompu
      # et faulthandler imprime la pile d appels de tous les fils.
      - name: Tests du relais
        working-directory: relay
        env:
          PYTHONFAULTHANDLER: '1'
          PYTHONUNBUFFERED: '1'
        run: timeout -s ABRT 300 python -m unittest discover -v -p 'test_*.py' < /dev/null

      - name: Tests de gpu-agents
        working-directory: gpu-agents
        env:
          PYTHONFAULTHANDLER: '1'
          PYTHONUNBUFFERED: '1'
        run: timeout -s ABRT 300 python -m unittest discover -v -p 'test_*.py' < /dev/null
